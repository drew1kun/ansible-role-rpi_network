---
- name: '[legacy] Check if /lib/udev/rules.d/75-persistent-net-generator.rules exists'
  ansible.builtin.stat: path=/lib/udev/rules.d/75-persistent-net-generator.rules
  register: rpi_network_75_persistent_net_generator_rules
  tags: [ 'rpi_network', 'rpi_network_legacy' ]

- name: '[legacy] Check /lib/udev/rules.d/75-persistent-net-generator.rules'
  ansible.builtin.command: >-
    fgrep -q 'KERNEL!="eth*[1-9]|ath*|wlan*[1-9]|msh*|ra*|sta*|ctc*|lcs*|hsi*"' \
      /lib/udev/rules.d/75-persistent-net-generator.rules
  register: result
  #ignore_errors: true
  failed_when: false
  changed_when: false
  become: true
  when: rpi_network_75_persistent_net_generator_rules.stat.exists
  tags: [ 'rpi_network', 'rpi_network_legacy' ]

- name: '[legacy] Comment old pattern in 75-persistent-net-generator.rules'
  ansible.builtin.replace:
    path: /lib/udev/rules.d/75-persistent-net-generator.rules
    regexp: '^(KERNEL!=".*$)'
    replace: '#\1'
  become: true
  when:
    - rpi_network_75_persistent_net_generator_rules.stat.exists
    - result.rc != 0 # result|failed can't be used because we use failed_when: false
  notify: Restart networking service
  tags: [ 'rpi_network', 'rpi_network_legacy' ]

- name: '[legacy] Insert right pattern into 75-persistent-net-generator.rules'
  ansible.builtin.lineinfile:
    path: /lib/udev/rules.d/75-persistent-net-generator.rules
    insertafter: '^#KERNEL!=".*$'
    line: 'KERNEL!="eth*[1-9]|ath*|wlan*[1-9]|msh*|ra*|sta*|ctc*|lcs*|hsi*" \'
  become: true
  when:
    - rpi_network_75_persistent_net_generator_rules.stat.exists
    - result.rc != 0
  notify: Restart networking service
  tags: [ 'rpi_network', 'rpi_network_legacy' ]

- name: '[legacy] Generate /etc/network/interfaces'
  ansible.builtin.template:
    src: interfaces.j2
    dest: /etc/network/interfaces
    owner: root
    group: root
    mode: 0644
  notify: Restart networking service
  become: true
  tags: [ 'rpi_network', 'rpi_network_legacy' ]
